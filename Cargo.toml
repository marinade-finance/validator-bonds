[workspace]
members = [
    "api",
    "common-rs",
    "merkle-tree",
    "programs/*",
    "bonds-collector",
    "settlement-pipelines",
    "settlement-distributions/bid-distribution",
    "settlement-distributions/settlement-common",
    "settlement-distributions/institutional-distribution",
    "settlement-distributions/merkle-generator"
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3

[workspace.dependencies]
agave-feature-set = "3.1.14"
anchor-client = { version = "1.2.1", features = ["async"] }
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1" }
anyhow = "1.0.82"
bincode = "1.3.3"
chrono = "0.4"
clap = { version = "4.1.11", features = ["derive", "env"] }
env_logger = "0.10.0"
fast-math = "0.1.1"
futures = "0.3.29"
gcp-bigquery-client = "0.28.0"
hex = "0.4.3"
log = "0.4.14"
merkle-tree = { path = "./merkle-tree" }
openssl = "0.10.80"
postgres-openssl = "0.5.1"
regex = "1.10.4"
reqwest = "0.11.22"
rust_decimal = { version = "1.37.1", features = ["db-postgres"] }
rust_decimal_macros = "1.37.1"
serde = "1.0.197"
serde_json = "1.0.114"
serde_yaml = "0.9"
settlement-common = { path = "settlement-distributions/settlement-common" }
snapshot-parser = { git = "https://github.com/marinade-finance/solana-snapshot-parser", rev = "58abd16413b28d6d148517391dbc445c912c993e" }
snapshot-parser-validator-cli = { git = "https://github.com/marinade-finance/solana-snapshot-parser", rev = "58abd16413b28d6d148517391dbc445c912c993e" }
shellexpand = "3.1.0"
solana-account-decoder = "3.1.14"
solana-account-info = "3.1"
solana-cli-output = { version = "3.1.14", features = ["agave-unstable-api"] }
solana-client = "3.1.14"
solana-commitment-config = "3"
solana-feature-gate-interface = { version = "=3.0.0", features = ["bincode"] }
solana-instructions-sysvar = "3.0.1"
solana-program = "3.0.0"
solana-pubkey = "3.0.0"
solana-sdk = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-stake-interface = { version = "=2.0.2", features = ["bincode", "borsh", "serde", "sysvar"] }
solana-security-txt = "1.1.3"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-transaction-executor = { git = "https://github.com/marinade-finance/solana-transaction-executor", tag = "solana-3.0.x" }
solana-transaction-builder = { git = "https://github.com/marinade-finance/solana-transaction-builder", tag = "solana-3.0.x" }
solana-transaction-builder-executor = { git = "https://github.com/marinade-finance/solana-transaction-builder", tag = "solana-3.0.x" }
solana-vote-interface = "3"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1.37"
tracing-log = "0.1.3"
tracing-subscriber = { version = "0.3" }
utoipa = { version = "3.2.1", features = ["chrono", "decimal"] }
validator-bonds = { path = "./programs/validator-bonds" }
validator-bonds-common = { path = "./common-rs" }
warp = { version = "0.3", features = ["compression-gzip"] }

[patch.crates-io]
# solana-ledger 4.3.0 (via the parser) calls rocksdb APIs only agave's fork has
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
