packages:
  - 'packages/*'
  - 'settlement-pipelines/'
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  node-hid: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@anchor-lang/borsh@1.2.1'
  - '@anchor-lang/core@1.2.1'
  - '@anchor-lang/errors@1.2.1'
  - '@marinade.finance/anchor-common'
  - '@marinade.finance/bankrun-utils'
  - '@marinade.finance/cli-common'
  - '@marinade.finance/config-common'
  - '@marinade.finance/ds-sam-calc'
  - '@marinade.finance/ds-sam-sdk'
  - '@marinade.finance/ts-common'
  - '@marinade.finance/web3js-1x-testing'
  - '@marinade.finance/web3js-1x'
  - '@marinade.finance/notifications-bonds-event-v1'
overrides:
  jayson: ^5.0.0
  tmp: ^0.2.6
  toml: ^4.2.0
peerDependencyRules:
  allowedVersions:
    jest: '29'
    '@coral-xyz/anchor': '1'
    # unreleased ledger-utils 4.0.0 widens this peer to ts-common ^5 with the same API
    '@marinade.finance/ledger-utils@3>@marinade.finance/ts-common': '5'
    # ws 7 only calls the default-exported validator function, unchanged in utf-8-validate 6
    'ws@7>utf-8-validate': '6'
