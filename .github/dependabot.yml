version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'dtolnay/rust-toolchain'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # majors are migrated by hand: many are ESM-only now while our packages are CommonJS
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # bankrun >0.2.0 runs a newer runtime where stake program calls are "temporarily restricted"
      - dependency-name: 'solana-bankrun'
      - dependency-name: 'anchor-bankrun'
