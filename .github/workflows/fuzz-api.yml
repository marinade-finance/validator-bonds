name: Fuzz API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'migrations/**'
      # crates the API builds from
      - 'common-rs/**'
      - 'merkle-tree/**'
      - 'programs/validator-bonds/**'
      - 'settlement-distributions/settlement-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'migrations/**'
      # crates the API builds from
      - 'common-rs/**'
      - 'merkle-tree/**'
      - 'programs/validator-bonds/**'
      - 'settlement-distributions/settlement-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  schemathesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Install rust compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libudev-dev libclang-dev llvm-dev postgresql

      - name: 🦿 Install Rust tookchain
        uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1

      - name: 🧠 Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fuzz-api-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-api-

      - name: 🐍 Install uv
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 🧨 Fuzz the API with schemathesis
        run: api/fuzz/run.sh
        env:
          FUZZ_WORKDIR: ${{ runner.temp }}/api-fuzz

      - name: 🧨 Fuzz the API against empty tables
        run: api/fuzz/run.sh --empty
        env:
          FUZZ_WORKDIR: ${{ runner.temp }}/api-fuzz-empty
