name: Verifiable Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'contract-v*'
  pull_request:
    paths:
      - 'programs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'

permissions:
  contents: read

concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifiable-build:
    uses: marinade-finance/.github/.github/workflows/verifiable-build.yml@main
    with:
      library-name: 'validator_bonds'
      # Cargo.lock pins solana-program 3.0.0 and 4.0.0, so the image cannot be derived from it
      base-image: 'solanafoundation/solana-verifiable-build:3.1.12'
      # security_txt bakes in env!("GIT_REV"), which a caller cannot supply, so a build here never matches the deployment
      verify-onchain: false
