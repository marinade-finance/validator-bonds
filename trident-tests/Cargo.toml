# Standalone workspace: trident-fuzz depends on solana-sdk 2.x, the program on 3.x.
[workspace]

[package]
name = "validator-bonds-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Trident instruction-level fuzz harness for the validator-bonds program"

[dependencies]
trident-fuzz = { version = "=0.12.0", features = ["stake", "vote"] }
borsh = "1.5.3"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
ruzstd = "0.7"
bincode = "1.3"
solana-stake-interface = { version = "1", features = ["bincode", "serde"] }
solana-vote-interface = { version = "2", features = ["bincode", "serde"] }

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"

[profile.release]
debug = 1
