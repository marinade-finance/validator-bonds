name: Anchor Test

on: workflow_dispatch

# Cargo and TS unit tests run on every PR in ts-lint-and-test.yml; this workflow runs the
# program-level suites that need the SBF build: LiteSVM and solana-test-validator, in parallel.

jobs:
  litesvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ochaloup/solana-test-validator:solana_3.1.12-anchor_1.2.1@sha256:36c73b293d577b12ff66cd99da6317aa4cc36db34abc5dcd4c7cdf2ca28abe8c
      options: --user root

    steps:
      - name: ⚓ Info + Setup on Anchor
        run: |
          anchor --version
          solana --version

      - name: 🌄 Set nightly toolchain
        run: rustup default nightly

      - name: 🏃‍♂️‍➡️ Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 👩‍🔧 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 👨‍🔧 Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 🧠 Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-anchor-litesvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-anchor-litesvm-

      - name: 🏋️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 LiteSVM tests
        run: pnpm test:litesvm

  test-validator:
    runs-on: ubuntu-24.04
    # ~25 min of suites (fresh validator per spec file) + SBF build + settlement-pipelines cargo build
    timeout-minutes: 60
    container:
      image: ochaloup/solana-test-validator:solana_3.1.12-anchor_1.2.1@sha256:36c73b293d577b12ff66cd99da6317aa4cc36db34abc5dcd4c7cdf2ca28abe8c
      options: --user root

    steps:
      - name: ⚓ Info + Setup on Anchor
        run: |
          anchor --version
          solana --version

      - name: ⚙️ Install rust compilation dependencies
        # settlement-pipelines suites build the CLIs; snapshot-parser builds rocksdb (libclang)
        run: |
          apt-get update
          apt-get -y install libudev-dev libclang-dev llvm-dev

      - name: 🌄 Set nightly toolchain
        run: rustup default nightly

      - name: 🏃‍♂️‍➡️ Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 👩‍🔧 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 👨‍🔧 Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 👓 Check solana config
        run: |
          [ -f ~/.config/solana/id.json ] || solana-keygen new --no-bip39-passphrase --silent -o ~/.config/solana/id.json
          solana config get

      - name: 🧠 Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-anchor-validator-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-anchor-validator-

      - name: 🏋️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build TypeScript projects
        run: pnpm -r build

      - name: 🧨 solana-test-validator tests
        run: pnpm test:validator

      - name: 📜 Upload validator logs of failed suites
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-validator-logs
          path: .anchor/test-validator-logs/
          if-no-files-found: ignore
