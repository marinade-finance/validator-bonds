[workspace]
members = [
    "api",
    "common-rs",
    "merkle-tree",
    "programs/*",
    "bonds-collector",
    "settlement-pipelines",
    "settlement-distributions/bid-distribution",
    "settlement-distributions/settlement-common",
    "settlement-distributions/institutional-distribution",
    "settlement-distributions/merkle-generator"
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true

[profile.release.build-override]
codegen-units = 1
incremental = false
opt-level = 3

[workspace.dependencies]
agave-feature-set = "4.3.2"
anchor-client = { version = "1.2.1", default-features = false, features = ["async", "solana-v4"] }
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v4", "associated_token", "mint", "token", "token_2022", "token_2022_extensions"] }
anyhow = "1.0.82"
bincode = "1.3.3"
chrono = "0.4"
clap = { version = "4.1.11", features = ["derive", "env"] }
env_logger = "0.11"
fast-math = "0.1.1"
futures = "0.3.29"
gcp-bigquery-client = "0.28.0"
hex = "0.4.3"
log = "0.4.14"
merkle-tree = { path = "./merkle-tree" }
openssl = "0.10.80"
postgres-openssl = "0.5.1"
regex = "1.10.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust_decimal = { version = "1.37.1", features = ["db-postgres"] }
rust_decimal_macros = "1.37.1"
serde = "1.0.197"
serde_json = "1.0.114"
serde_yaml = "0.9"
settlement-common = { path = "settlement-distributions/settlement-common" }
snapshot-parser = { git = "https://github.com/marinade-finance/solana-snapshot-parser", rev = "7a4fa6409d7eace499b4c3afc81ac7f126743a84" }
snapshot-parser-validator-cli = { git = "https://github.com/marinade-finance/solana-snapshot-parser", rev = "7a4fa6409d7eace499b4c3afc81ac7f126743a84" }
shellexpand = "3.1.0"
solana-account-decoder = "4.3.2"
solana-account-info = "3.1"
solana-cli-output = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-client = "4.3.2"
solana-commitment-config = "3"
solana-feature-gate-interface = { version = "4.0.0", features = ["bincode"] }
solana-instructions-sysvar = "4.0.0"
solana-program = "4.0.0"
solana-pubkey = "4.3"
solana-sdk = "4.0.1"
solana-sdk-ids = "3.1.0"
solana-stake-interface = { version = "4.4", features = ["bincode", "borsh", "serde", "sysvar"] }
solana-security-txt = "1.1.3"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-transaction-executor = { git = "https://github.com/marinade-finance/solana-transaction-executor", branch = "solana-to-4.x" }
solana-transaction-builder = { git = "https://github.com/marinade-finance/solana-transaction-builder", rev = "943d78b" }
solana-transaction-builder-executor = { git = "https://github.com/marinade-finance/solana-transaction-builder", rev = "943d78b" }
solana-vote-interface = "6.1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1.37"
tracing-log = "0.1.3"
tracing-subscriber = { version = "0.3" }
utoipa = { version = "3.2.1", features = ["chrono", "decimal"] }
validator-bonds = { path = "./programs/validator-bonds" }
validator-bonds-common = { path = "./common-rs" }

[patch.crates-io]
# solana-ledger 4.3.2 (via the parser) calls rocksdb APIs only agave's fork has
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
