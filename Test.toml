[scripts]
# Validator config read by scripts/test-validator.sh (pnpm test:validator), which starts a fresh
# solana-test-validator per spec file; keep the layout parseable (one key = "value" per line).
# A single file also runs via `ANCHOR_BUILD_SBF_ARCH=v0 FILE=<spec> anchor test`.
test = "pnpm _test"

[test.validator]
slots_per_epoch = "32"

[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"  
program = "fixtures/programs/metaplex_token_metadata_program.so"

[[test.validator.account_dir]]
directory = "fixtures/accounts"

[[test.validator.account_dir]]
directory = "fixtures/accounts/settlement-pipelines"

[[test.validator.account_dir]]
directory = "fixtures/accounts-marinade-liquid"
